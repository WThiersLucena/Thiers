<div 
  class="modal-overlay" 
  *ngIf="isOpen"
  (click)="onOverlayClick($event)"
>
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="closeModal()" aria-label="Fechar modal">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    
    <div class="modal-body" *ngIf="selectedSolution">
      <div class="modal-header">
        <span class="modal-icon">{{ selectedSolution.icon }}</span>
        <h2>{{ selectedSolution.title }}</h2>
      </div>
      
      <!-- Carrossel SaaS -->
      <div class="saas-carousel-container" *ngIf="selectedSolution.saasCards && selectedSolution.saasCards.length > 0">
        <div class="saas-carousel">
          <div 
            class="saas-carousel-item" 
            *ngFor="let card of selectedSolution.saasCards; let i = index"
            [class.active]="i === currentCarouselIndex"
            [class.clickable]="card.link"
            (click)="card.link && openLink(card.link)"
          >
            <div class="saas-carousel-image" *ngIf="card.image">
              <img [src]="card.image" [alt]="card.title" />
            </div>
            <div class="saas-carousel-icon" *ngIf="card.icon && !card.image">
              {{ card.icon }}
            </div>
            <h3 class="saas-carousel-title">{{ card.title }}</h3>
          </div>
        </div>
        
        <!-- Botões de navegação do carrossel -->
        <div class="carousel-controls" *ngIf="selectedSolution.saasCards.length > 1">
          <button class="carousel-btn carousel-btn-prev" (click)="prevSlide()" aria-label="Slide anterior">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          
          <!-- Indicadores do carrossel -->
          <div class="carousel-indicators">
            <button 
              *ngFor="let card of selectedSolution.saasCards; let i = index"
              class="carousel-indicator"
              [class.active]="i === currentCarouselIndex"
              (click)="goToSlide(i)"
              [attr.aria-label]="'Ir para slide ' + (i + 1)"
            ></button>
          </div>
          
          <button class="carousel-btn carousel-btn-next" (click)="nextSlide()" aria-label="Próximo slide">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      
      <div class="modal-text" [innerHTML]="selectedSolution.content"></div>
      
      <div class="modal-footer">
        <button class="btn btn-primary" (click)="closeModal()">Fechar</button>
        <a class="btn btn-secondary" (click)="openWhatsApp()">Fale Conosco</a>
      </div>
    </div>
  </div>
</div>
