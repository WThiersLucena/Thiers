<header
  class="header"
  [class.scrolled]="isScrolled"
  [class.header-hidden]="!isHeaderVisible"
>
  <div class="container">
    <nav class="navbar">
      <div class="logo-container">
        <div class="logo">
          <img
            src="assets/Logo-Sem-Fundo.png"
            alt="Thiers Logo"
            class="logo-img"
          />
        </div>
        <div class="logo-text-container">
          <span class="logo-text-blue">Soluções em Tecnologia</span>
        </div>
      </div>

      <div class="nav-right">
        <ul class="nav-menu" [class.active]="isMenuOpen">
          <li><a href="#home" (click)="closeMenu()">Home</a></li>
          <li><a href="#sobre" (click)="closeMenu()">Sobre</a></li>
          <li><a href="#solucoes" (click)="closeMenu()">Soluções</a></li>
          <li><a href="#depoimentos" (click)="closeMenu()">Depoimentos</a></li>
          <li><a href="#contato" (click)="closeMenu()">Contato</a></li>
        </ul>

        <div class="header-actions">
          <button
            class="menu-toggle"
            (click)="toggleMenu()"
            aria-label="Toggle menu"
          >
            <span [class.active]="isMenuOpen"></span>
            <span [class.active]="isMenuOpen"></span>
            <span [class.active]="isMenuOpen"></span>
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
