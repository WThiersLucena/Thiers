<header class="header">
  <div class="container">
    <nav class="navbar">
      <div class="logo-container">
        <div class="logo">
          <img
            src="assets/Logo-Sem-Fundo.png"
            alt="Thiers Logo"
            class="logo-img"
          />
          <div class="logo-text-container">
            <span class="logo-text-blue">Soluções em Tecnologia</span>
          </div>
        </div>
      </div>

      <div class="nav-right">
        <ul class="nav-menu" [class.active]="isMenuOpen">
          <li><a href="#home" (click)="closeMenu()">Home</a></li>
          <li><a href="#sobre" (click)="closeMenu()">Sobre</a></li>
          <li><a href="#solucoes" (click)="closeMenu()">Soluções</a></li>
          <li><a href="#depoimentos" (click)="closeMenu()">Depoimentos</a></li>
          <li><a href="#contato" (click)="closeMenu()">Contato</a></li>
          <li>
            <a class="btn btn-primary" (click)="openWhatsApp()">Fale Conosco</a>
          </li>
        </ul>

        <div class="header-actions">
          <button
            class="theme-toggle"
            (click)="toggleTheme()"
            [attr.aria-label]="
              currentTheme === 'light'
                ? 'Ativar modo escuro'
                : 'Ativar modo claro'
            "
            [title]="
              currentTheme === 'light'
                ? 'Ativar modo escuro'
                : 'Ativar modo claro'
            "
          >
            <svg
              *ngIf="currentTheme === 'light'"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg
              *ngIf="currentTheme === 'dark'"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="12"
                cy="12"
                r="5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <button
            class="menu-toggle"
            (click)="toggleMenu()"
            aria-label="Toggle menu"
          >
            <span [class.active]="isMenuOpen"></span>
            <span [class.active]="isMenuOpen"></span>
            <span [class.active]="isMenuOpen"></span>
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
