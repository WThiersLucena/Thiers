<section class="hero" id="home">
  <div
    class="hero__bg"
    [style.background-image]="'url(assets/Img-Fundo-1.png)'"
    aria-hidden="true"
  ></div>
  <div class="hero__overlay" aria-hidden="true"></div>
  <div class="container hero__layout">
    <div class="hero__copy" [class.hero__copy--visible]="showContent">
      <p class="hero__eyebrow">
        Sua empresa não precisa de mais esforço manual.
      </p>
      <h1 class="hero__lead">
        Automatize processos, reduza retrabalho e multiplique sua eficiência
      </h1>
      <p class="hero__lead">
        Quem fica no analógico perde prazo, cliente e dinheiro.
        <span class="hero__lead-strong">Impulsione seus resultados agora</span>
      </p>
      <button type="button" class="hero__cta" (click)="openSiteLead()">
        Soluções sob medida. →
      </button>
    </div>
  </div>
</section>
