<section class="hero" id="home">
  <div
    class="hero__bg"
    [style.background-image]="'url(assets/Img-Fundo-1.png)'"
    aria-hidden="true"
  ></div>
  <div class="hero__overlay" aria-hidden="true"></div>
  <div class="container hero__layout">
    <div class="hero__copy" [class.hero__copy--visible]="showContent">
      <p class="hero__eyebrow">Personalizados</p>
      <h1 class="hero__title">Sistemas</h1>
      <p class="hero__lead">
        <span class="hero__lead-strong">Impulsione seu negócio</span>
        marcando presença online
      </p>
      <button type="button" class="hero__cta" (click)="openSiteLead()">
        Crie seu site agora →
      </button>
    </div>
  </div>
</section>
