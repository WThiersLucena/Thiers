<section class="hero" id="home" [class.hero-with-image]="shouldShowImage">
  <video
    *ngIf="shouldLoadVideo"
    #heroVideo
    class="hero-video"
    autoplay
    muted
    playsinline
    [attr.muted]="true"
    [attr.volume]="0"
  >
    <source src="assets/Logo-Thiers-mov.mp4" type="video/mp4" />
  </video>
  <div
    class="hero-background-image"
    *ngIf="shouldShowImage"
    [style.background-image]="'url(assets/Z1.jpg)'"
  ></div>
  <div class="hero-overlay"></div>
  <div class="container">
    <div class="hero-content">
      <h1 class="hero-title">
        Inovação e tecnologia para acelerar a transformação digital
      </h1>
      <p class="hero-description">
        Especialista no desenvolvimento de soluções digitais, a Thiers é uma
        empresa focada em levar a transformação digital a empresas, mudando a
        maneira como elas lidam com a tecnologia.
      </p>
      <a class="btn btn-primary" (click)="openWhatsApp()">Fale conosco</a>
    </div>
  </div>
</section>
