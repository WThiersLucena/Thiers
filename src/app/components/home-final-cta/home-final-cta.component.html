<section class="final-cta" aria-labelledby="final-cta-title">

    <div class="final-cta__copy">
      <h2 id="final-cta-title" class="final-cta__title">
        Vamos virar a chave?
      </h2>
      <p class="final-cta__text">
        Estamos prontos para entender suas nescessidades e estruturarmos o
        melhor caminho para sua empresa.
      </p>
      <button type="button" class="final-cta__btn" (click)="openWhatsApp()">
        WhatsApp

    </div>
    <div class="final-cta__visual">
      <img
        src="assets/1-1-500x335.jpeg"
        alt=""

        loading="lazy"
        decoding="async"
      />
